<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>あそびタイマー🚃</title>
<style>
:root {
  --yellow: #f5c800;
  --bg: #0f1117;
  --panel: #181c27;
  --border: #252a3a;
  --text: #e8ecf5;
  --dim: #4a5270;
  --green: #34c97a;
  --orange: #ff8c22;
  --red: #ff3355;
  --passed-text: #2e3555;
  --accent: #f5c800;
}
body.shinkansen { --accent: #00aaff; }
body.chuo      { --accent: #f15a22; }
body.azusa     { --accent: #a05cc8; }

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  padding: 16px 12px 48px;
}

.route-selector { width: 100%; max-width: 560px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.route-btn {
  padding: 10px 6px; border-radius: 10px;
  border: 2px solid var(--border); background: var(--panel);
  color: var(--dim); font-size: 12px; font-weight: 700;
  cursor: pointer; text-align: center; line-height: 1.5;
  -webkit-appearance: none;
}
.route-btn.active { border-color: var(--accent); color: var(--accent); }

.header { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 14px; text-align: center; }
.line-badge { font-size: 11px; font-weight: 900; letter-spacing: 2px; padding: 3px 14px; border-radius: 20px; background: var(--accent); color: #111; }
.header-title { font-size: clamp(17px, 5vw, 22px); font-weight: 900; }
.header-sub { font-size: 12px; color: var(--dim); }

.controls { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.slider-wrap { display: flex; flex-direction: column; gap: 6px; }
.slider-label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--dim); }
.slider-value { font-size: 22px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
input[type=range] {
  -webkit-appearance: none; width: 100%; height: 8px;
  border-radius: 4px; background: var(--border); outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 32px; height: 32px;
  border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 10px rgba(245,200,0,0.4);
}
.tick-row { display: flex; justify-content: space-between; padding: 0 2px; }
.tick { font-size: 10px; color: var(--dim); }

.btn-row { display: flex; gap: 10px; }
.btn {
  flex: 1; padding: 15px; border: none; border-radius: 12px;
  font-size: 16px; font-weight: 900; cursor: pointer;
  -webkit-appearance: none;
}
.btn-start { background: var(--accent); color: #111; }
.btn-start:active { opacity: 0.85; }
.btn-reset { background: var(--panel); border: 1px solid var(--border); color: var(--dim); }

.announce-row { width: 100%; max-width: 560px; margin-bottom: 10px; }
.btn-announce {
  width: 100%; padding: 12px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--panel);
  color: var(--dim); font-size: 14px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  -webkit-appearance: none;
}
.btn-announce.on { border-color: var(--green); color: var(--green); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
.btn-announce.on .dot { background: var(--green); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.2; } }

.time-panel {
  width: 100%; max-width: 560px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 20px 14px; display: flex; flex-direction: column;
  align-items: center; gap: 10px; margin-bottom: 12px;
}
.time-main {
  font-size: clamp(52px, 16vw, 80px); font-weight: 300;
  font-variant-numeric: tabular-nums; letter-spacing: 2px;
  line-height: 1; color: var(--text); display: flex; align-items: baseline;
}
.time-ms { font-size: 1em; opacity: 0.75; }
.time-label { font-size: 11px; color: var(--dim); letter-spacing: 2px; }

.progress-wrap { width: 100%; display: flex; flex-direction: column; gap: 5px; }
.progress-bar-bg { height: 14px; background: #1a1e2e; border-radius: 7px; overflow: hidden; border: 1px solid var(--border); }
.progress-bar { height: 100%; border-radius: 7px; width: 0%; background: var(--accent); }
.progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); }

.alert { width: 100%; max-width: 560px; padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; text-align: center; margin-bottom: 10px; display: none; }
.alert.show { display: block; animation: pulse 1.2s infinite alternate; }
.alert-orange { background: rgba(255,140,34,0.12); border: 1.5px solid var(--orange); color: var(--orange); }
.alert-red    { background: rgba(255,51,85,0.12);  border: 1.5px solid var(--red);    color: var(--red); }
@keyframes pulse { from { opacity: 0.75; } to { opacity: 1; } }

.track-outer { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.track-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 8px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--dim); letter-spacing: 2px; }
.stations-scroll { max-height: 50vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }

.station-row { display: flex; align-items: center; padding: 0 16px; min-height: 56px; border-bottom: 1px solid rgba(37,42,58,0.5); }
.station-row.passed { opacity: 0.28; }
.station-row.current { background: rgba(245,200,0,0.06); }
.station-row.current .station-kanji { color: var(--accent); font-weight: 900; }
.station-row.current .station-ruby { color: var(--accent); }

.track-line-col { width: 32px; display: flex; flex-direction: column; align-items: center; align-self: stretch; flex-shrink: 0; }
.line-seg { width: 4px; background: var(--accent); flex: 1; }
.line-seg.passed { background: var(--passed-text); }
.station-dot { width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--accent); background: var(--bg); flex-shrink: 0; z-index: 1; }
.station-dot.passed { border-color: var(--passed-text); background: var(--passed-text); }
.station-dot.current { width: 18px; height: 18px; background: var(--accent); border-color: var(--accent); animation: pdot 0.9s infinite alternate; }
@keyframes pdot { from { opacity: 0.6; } to { opacity: 1; } }

.train-icon { font-size: 16px; margin-right: 4px; display: none; }
.station-row.current .train-icon { display: block; }
.station-info { flex: 1; display: flex; align-items: center; gap: 6px; padding-left: 8px; }
.station-number { font-size: 10px; color: var(--dim); min-width: 30px; }
.station-name-wrap { display: flex; flex-direction: column; gap: 1px; }
.station-kanji { font-size: clamp(13px,3.5vw,15px); font-weight: 700; line-height: 1.2; color: var(--text); }
.station-ruby { font-size: clamp(11px,3vw,12px); font-weight: 400; opacity: 0.55; color: var(--text); line-height: 1.1; }
.station-name-wrap.passed-name .station-kanji,
.station-name-wrap.passed-name .station-ruby { color: var(--passed-text); }

.milestone { font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: 700; flex-shrink: 0; }
.m-pref { background: rgba(52,201,122,0.15); color: var(--green); border: 1px solid rgba(52,201,122,0.3); }
.m-key  { background: rgba(245,200,0,0.12); color: #f5c800; border: 1px solid rgba(245,200,0,0.3); }
.station-time { margin-left: auto; font-size: 11px; color: var(--dim); min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
.station-time.current-t { color: var(--accent); font-weight: 700; }
.station-time.passed-t  { color: var(--passed-text); }

.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: rgba(24,28,39,0.97); border: 1px solid var(--border);
  border-radius: 12px; padding: 11px 20px; font-size: 14px; font-weight: 700;
  color: var(--text); white-space: nowrap; opacity: 0;
  transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 30;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.overlay { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.88); flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; }
.overlay.show { display: flex; }
.overlay-icon { font-size: 72px; }
.overlay-title { font-size: clamp(22px,6vw,30px); font-weight: 900; color: var(--accent); text-align: center; }
.overlay-msg { font-size: 16px; font-weight: 700; text-align: center; line-height: 1.7; }
.btn-close { background: var(--accent); color: #111; border: none; padding: 14px 40px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 8px; -webkit-appearance: none; }
</style>
</head>

<div class="alert alert-red"    id="alertRed">🚨 もうすぐ到着！あそびはもうおわりだよ！！</div>

<div class="track-outer">

<div class="overlay" id="overlay">

  <div class="overlay-title" id="overlayTitle"></div>
  <div class="overlay-msg"   id="overlayMsg"></div>

// ============================================================
// Audio — Web Audio API
// ============================================================
let actx = null;
function getActx() {
  if (!actx) try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  return actx;
}
function resumeActx() {
  const c = getActx();
  if (c && c.state !== 'running') c.resume();
}

function playNotes(notes, type) {
  const c = getActx(); if (!c) return;
  notes.forEach(({f, t, d}) => {
    try {
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = type; osc.frequency.value = f;
      osc.connect(g); g.connect(c.destination);
      const s = c.currentTime + t;
      g.gain.setValueAtTime(0, s);
      g.gain.linearRampToValueAtTime(0.2, s + 0.03);
      g.gain.setValueAtTime(0.2, s + d - 0.05);
      g.gain.linearRampToValueAtTime(0, s + d);
      osc.start(s); osc.stop(s + d + 0.05);
    } catch(e){}
  });
}

function playWhistle() {
  if (ROUTES[routeIdx].whistle === 'shinkansen') {
    // のぞみ：ソ→ミ→ラ→ソ→ド→ラ
    playNotes([
      {f:784, t:0.00, d:0.22},{f:659, t:0.20, d:0.22},
      {f:880, t:0.40, d:0.22},{f:784, t:0.60, d:0.40},
      {f:1047,t:1.05, d:0.22},{f:880, t:1.25, d:0.45},
    ], 'sine');
  } else {
    // 総武線：ミ→ファ→ソ→ラ
    playNotes([
      {f:659, t:0.00, d:0.22},{f:698, t:0.20, d:0.22},
      {f:784, t:0.40, d:0.22},{f:880, t:0.60, d:0.42},
    ], 'triangle');
  }
}

// ============================================================
// Speech — iOS ローカルファイル対応
// ============================================================
let voices = [];
let speechReady = false;

function loadVoices() {
  if (!window.speechSynthesis) return;
  const v = speechSynthesis.getVoices();
  if (v.length) { voices = v; speechReady = true; }
}
if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

function speakText(text) {
  if (!window.speechSynthesis || !announceOn) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 0.88;
    if (voices.length) {
      const ja = voices.find(v => v.lang.startsWith('ja')) || voices[0];
      if (ja) u.voice = ja;
    }
    speechSynthesis.speak(u);
  } catch(e){}
}

// ユーザー操作タイミングで Audio + Speech を両方アンロック
function unlockAll() {
  resumeActx();
  if (window.speechSynthesis) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0; u.lang = 'ja-JP';
      speechSynthesis.speak(u);
    } catch(e){}
    loadVoices();
  }
}

// ============================================================
// 路線選択
// ============================================================
function selectRoute(idx) {
  routeIdx = idx;
  document.querySelectorAll('.route-btn').forEach((b,i) => b.classList.toggle('active', i===idx));
  document.body.classList.remove('shinkansen','chuo','azusa');
  if (idx===1) document.body.classList.add('shinkansen');
  else if (idx===2) document.body.classList.add('chuo');
  else if (idx===3) document.body.classList.add('azusa');
  const r = ROUTES[idx];
  document.getElementById('lineBadge').textContent   = r.badge;
  document.getElementById('headerTitle').textContent = r.title;
  document.getElementById('headerSub').textContent   = r.sub;
  document.getElementById('labelFrom').textContent   = r.from;
  document.getElementById('labelTo').textContent     = r.to;
  document.getElementById('startBtn').textContent    = r.icon + ' しゅっぱつ！';
  STATIONS = r.stations; N = STATIONS.length;
  buildList();
  resetState();
  applySlider(parseInt(document.getElementById('timeSlider').value));
}

// ============================================================
// 路線図リスト構築
// ============================================================
function buildList() {
  const wrap = document.getElementById('stationsScroll');
  wrap.innerHTML = '';
  const icon = ROUTES[routeIdx].icon;
  STATIONS.forEach((st, i) => {
    const row = document.createElement('div');
    row.className = 'station-row'; row.id = 'st'+i;
    const mHTML = st.ms
      ? `<span class="milestone ${st.ms==='pref'?'m-pref':'m-key'}">${st.ms==='pref'?'都県境':'主要駅'}</span>`
      : '';
    row.innerHTML = `
      <div class="track-line-col">
        <div class="line-seg" id="st${i}top" ${i===0?'style="visibility:hidden"':''}></div>
        <div class="station-dot" id="st${i}dot"></div>
        <div class="line-seg" id="st${i}bot" ${i===N-1?'style="visibility:hidden"':''}></div>
      </div>
      <span class="train-icon">${icon}</span>
      <div class="station-info">
        <span class="station-number">${st.num}</span>
        <span class="station-name-wrap" id="st${i}name">
          <span class="station-kanji">${st.name}</span>
          <span class="station-ruby">${st.ruby}</span>
        </span>
        ${mHTML}
        <span class="station-time" id="st${i}time"></span>
      </div>`;
    wrap.appendChild(row);
  });
}

// ============================================================
// スライダー
// ============================================================
const STEPS = [5,10,15,20,25,30,35,40,45,50,55,60,65,70,75,80];

function onSlider(val) {
  if (running) return;
  applySlider(parseInt(val));
}

function applySlider(val) {
  const min = STEPS[val];
  document.getElementById('sliderValue').textContent = min + 'ふん';
  totalMs = min * 60000;
  remainMs = totalMs;
  computeThresholds();
  refreshStationTimes();
  renderDisplay();
}

function computeThresholds() {
  // thresholds[i] = 駅iになった時点のremainMs
  thresholds = STATIONS.map((_, i) => totalMs * (N-1-i) / (N-1));
}

function refreshStationTimes() {
  STATIONS.forEach((_, i) => {
    const ms = Math.round(totalMs * (N-1-i) / (N-1));
    const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
    const el = document.getElementById('st'+i+'time');
    if (el) el.textContent = i===N-1 ? '0:00' : m+':'+String(s).padStart(2,'0');
  });
}

// ============================================================
// タイマー制御
// ============================================================
function handleStart() {
  unlockAll(); // 必ずユーザー操作タイミングでアンロック
  if (running) {
    // 一時停止
    clearInterval(timerInterval);
    running = false;
    document.getElementById('startBtn').textContent = '▶ さいかい';
  } else {
    if (!totalMs) return;
    running = true;
    // startTime = 「今この瞬間にremainMsだけ残っている」基準点
    startTime = Date.now() - (totalMs - remainMs);
    document.getElementById('startBtn').textContent = '⏸ ていし';
    playWhistle();
    // 出発時アナウンス（最初の駅を発車）
    if (isFresh) {
      isFresh = false;
      const st0 = STATIONS[0], st1 = STATIONS[1];
      showToast(ROUTES[routeIdx].icon + ' ' + st0.name + 'を発車');
      if (announceOn && st1) {
        setTimeout(function(){
          speakText(st0.name + 'を発車しました。次は' + st1.name + 'です。');
        }, 900);
      }
    }
    timerInterval = setInterval(tick, 33); // ~30fps、iOSでも安定
  }
}

function tick() {
  const elapsed = Date.now() - startTime;
  const prev = remainMs;
  remainMs = Math.max(0, totalMs - elapsed);

  // 閾値チェック（駅通過アナウンス）
  for (let i = 1; i < N; i++) {
    if (prev > thresholds[i] && remainMs <= thresholds[i]) {
      onStationReached(i);
    }
  }

  renderDisplay();
  if (remainMs <= 0) { finish(); }
}

function onStationReached(idx) {
  const st = STATIONS[idx];
  const next = STATIONS[idx+1];
  const isLast = idx === N-1;
  showToast(ROUTES[routeIdx].icon + ' ' + st.name + 'を発車');
  if (announceOn) {
    const txt = isLast
      ? 'まもなく終点、' + st.name + '。' + st.name + 'です。あそびじかん、しゅうりょうです。'
      : st.name + 'を発車しました。次は' + next.name + 'です。';
    speakText(txt);
  }
}

// ============================================================
// 表示更新
// ============================================================
function renderDisplay() {
  const m  = Math.floor(remainMs / 60000);
  const s  = Math.floor((remainMs % 60000) / 1000);
  const cs = Math.floor((remainMs % 1000) / 10);
  const td = document.getElementById('timeDisplay');
  td.innerHTML = pad(m)+':'+pad(s)+'<span class="time-ms">.'+ pad(cs)+'</span>';

  const pct = totalMs > 0 ? remainMs / totalMs : 1;
  const pb = document.getElementById('progressBar');
  pb.style.width = ((1-pct)*100) + '%';
  let col = pct > 0.5 ? 'var(--accent)' : pct > 0.2 ? 'var(--orange)' : 'var(--red)';
  pb.style.background = col;
  td.style.color = pct > 0.5 ? 'var(--text)' : col;

  const stIdx = Math.min(N-1, Math.floor((1-pct)*N));
  document.getElementById('passedCount').textContent = stIdx + '駅通過';
  document.getElementById('remainCount').textContent = '残り' + (N-stIdx-1) + '駅';
  document.getElementById('currentStation').textContent = '📍 ' + STATIONS[stIdx].name;

  if (stIdx !== lastStIdx) {
    for (let i = 0; i < N; i++) {
      const isPassed = i < stIdx, isCur = i === stIdx;
      document.getElementById('st'+i).className = 'station-row' + (isPassed?' passed':isCur?' current':'');
      document.getElementById('st'+i+'dot').className = 'station-dot' + (isPassed?' passed':isCur?' current':'');
      document.getElementById('st'+i+'name').className = 'station-name-wrap' + (isPassed?' passed-name':'');
      const te = document.getElementById('st'+i+'time');
      te.className = 'station-time' + (isPassed?' passed-t':isCur?' current-t':'');
      const top = document.getElementById('st'+i+'top');
      const bot = document.getElementById('st'+i+'bot');
      if (top) top.className = 'line-seg' + (isPassed?' passed':'');
      if (bot) bot.className = 'line-seg' + (i < stIdx?' passed':'');
    }
    if (running) {
      const cur = document.getElementById('st'+stIdx);
      if (cur) cur.scrollIntoView({behavior:'smooth', block:'center'});
    }
    lastStIdx = stIdx;
  }

  document.getElementById('alertOrange').classList.toggle('show', pct <= 0.5 && pct > 0.2);
  document.getElementById('alertRed').classList.toggle('show', pct <= 0.2 && remainMs > 0);
}

function pad(n) { return String(n).padStart(2,'0'); }

// ============================================================
// 終了・リセット
// ============================================================
function finish() {
  clearInterval(timerInterval);
  running = false; timerInterval = null;
  remainMs = 0; renderDisplay();
  const r = ROUTES[routeIdx];
  document.getElementById('overlayIcon').textContent  = r.endIcon;
  document.getElementById('overlayTitle').textContent = r.endTitle;
  const tripMin = Math.round(totalMs / 60000);
  document.getElementById('overlayMsg').innerHTML =
    'こんかいの旅は <b>' + tripMin + 'ふん</b> でした。<br>あそびの時間はおわりです。<br>後片付けしようね！';
  document.getElementById('overlay').classList.add('show');
  if (announceOn) {
    setTimeout(function(){
      speakText('こんかいの旅は、' + tripMin + 'ふんでした。');
    }, 3500);
  }
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
  handleReset();
}

function handleReset() {
  clearInterval(timerInterval);
  running = false; timerInterval = null; startTime = null;
  lastStIdx = -1; isFresh = true;
  // デフォルトに戻す
  document.getElementById('timeSlider').value = 0;
  applySlider(0);
  setAnnounce(true);
  document.getElementById('startBtn').textContent = ROUTES[routeIdx].icon + ' しゅっぱつ！';
  document.getElementById('alertOrange').classList.remove('show');
  document.getElementById('alertRed').classList.remove('show');
  document.getElementById('stationsScroll').scrollTop = 0;
  resetListDOM();
}

function resetState() {
  clearInterval(timerInterval);
  running = false; timerInterval = null; startTime = null;
  remainMs = 0; lastStIdx = -1; thresholds = []; isFresh = true;
  document.getElementById('alertOrange').classList.remove('show');
  document.getElementById('alertRed').classList.remove('show');
  document.getElementById('stationsScroll').scrollTop = 0;
}

function resetListDOM() {
  for (let i = 0; i < N; i++) {
    const r = document.getElementById('st'+i); if(r) r.className='station-row';
    const d = document.getElementById('st'+i+'dot'); if(d) d.className='station-dot';
    const n = document.getElementById('st'+i+'name'); if(n) n.className='station-name-wrap';
    const t = document.getElementById('st'+i+'time'); if(t){ t.className='station-time'; t.textContent=''; }
    const tp = document.getElementById('st'+i+'top'); if(tp) tp.className='line-seg';
    const bt = document.getElementById('st'+i+'bot'); if(bt) bt.className='line-seg';
  }
}

// ============================================================
// アナウンス
// ============================================================
function handleAnnounce() {
  unlockAll();
  setAnnounce(!announceOn);
}

function setAnnounce(on) {
  announceOn = on;
  const btn = document.getElementById('announceBtn');
  btn.classList.toggle('on', on);
  btn.innerHTML = '<span class="dot"></span>🔊 駅アナウンス：' + (on ? 'オン' : 'オフ');
}

// ============================================================
// トースト
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
// 初期化 — scriptの末尾で直接実行（ローカルHTML対応）
// ============================================================
selectRoute(0);
</script>
</body>
</html>
